  // =============================

  var $=function(i){return document.getElementById(i)};
  var cart={}, catAtual=MENU[0].cat, todos={}, busca="";
  MENU.forEach(function(c){c.itens.forEach(function(i){todos[i.id]=i})});
  function brl(v){return "R$ "+v.toFixed(2).replace(".",",")}
  function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
  function total(){return Object.keys(cart).reduce(function(a,id){return a+cart[id]*todos[id].preco},0)}
  function qtd(){return Object.keys(cart).reduce(function(a,id){return a+cart[id]},0)}

  function renderTabs(){
    $("tabs").innerHTML=MENU.map(function(c){return "<button class='"+(c.cat===catAtual?"on":"")+"' data-c='"+c.cat+"'>"+c.cat+"</button>"}).join("");
  }
  function renderMenu(){
    var c=MENU.filter(function(x){return x.cat===catAtual})[0];var lista=c.itens;
    if(busca){lista=Object.keys(todos).map(function(k){return todos[k]}).filter(function(i){return (i.nome+" "+i.desc).toLowerCase().indexOf(busca)>-1});
      if(!lista.length){$("menu").innerHTML="<p style='text-align:center;color:var(--muted);padding:30px'>Nenhum item encontrado.</p>";return}}
    $("menu").innerHTML=lista.map(function(i){var n=cart[i.id]||0;
      return "<div class='item' style='animation-delay:"+((lista.indexOf(i)%8)*35)+"ms'><div class='em'>"+i.em+"</div><div class='t'><b>"+esc(i.nome)+"</b><p>"+esc(i.desc)+"</p><span class='pr'>"+brl(i.preco)+"</span></div>"+
      "<div class='qty'>"+(n?"<button class='m' data-a='-' data-id='"+i.id+"'>−</button><span>"+n+"</span>":"")+"<button data-a='+' data-id='"+i.id+"'>+</button></div></div>";}).join("");
  }
  function renderBar(){
    var q=qtd();$("bar").style.display=q?"block":"none";
    $("bQtd").textContent=q+(q===1?" item":" itens");$("bTot").textContent=brl(total());
  }
  function renderResumo(){
    var h=Object.keys(cart).map(function(id){var i=todos[id];
      return "<div class='r'><span>"+cart[id]+"× "+esc(i.nome)+"</span><span>"+brl(cart[id]*i.preco)+"</span></div>"}).join("");
    var taxa=$("tipo").value==="entrega"?TAXA_ENTREGA:0;
    if(taxa>0)h+="<div class='r'><span>Taxa de entrega</span><span>"+brl(taxa)+"</span></div>";
    h+="<div class='tt'><span>Total</span><span>"+brl(total()+taxa)+"</span></div>";
    $("resumo").innerHTML=h;
  }
  function refresh(){renderMenu();renderBar()}

  $("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;catAtual=b.dataset.c;renderTabs();renderMenu()});
  $("menu").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;var id=b.dataset.id;
    if(b.dataset.a==="+")cart[id]=(cart[id]||0)+1;
    else{cart[id]=(cart[id]||0)-1;if(cart[id]<=0)delete cart[id]}
    refresh();
  });
  $("abrir").onclick=function(){renderResumo();$("err").textContent="";$("dlg").showModal()};
  $("voltar").onclick=function(){$("dlg").close()};
  $("tipo").onchange=function(){$("endBox").hidden=$("tipo").value!=="entrega";renderResumo()};
  $("pag").onchange=function(){$("trocoBox").hidden=$("pag").value!=="Dinheiro"};

  $("enviar").onclick=function(){
    var nome=$("nome").value.trim(),entrega=$("tipo").value==="entrega",end=$("end").value.trim();
    if(!nome){$("err").textContent="Digite seu nome.";return}
    if(entrega&&end.length<6){$("err").textContent="Digite o endereço de entrega.";return}
    var taxa=entrega?TAXA_ENTREGA:0;
    var L=["*NOVO PEDIDO – Tibas Lanche* 🍔","","*Cliente:* "+nome,"","*Itens:*"];
    Object.keys(cart).forEach(function(id){var i=todos[id];L.push("• "+cart[id]+"x "+i.nome+" – "+brl(cart[id]*i.preco))});
    L.push("");
    if(taxa>0)L.push("*Taxa de entrega:* "+brl(taxa));
    L.push("*Total:* "+brl(total()+taxa),"");
    L.push(entrega?"*Entrega em:* "+end:"*Retirada no balcão*");
    L.push("*Pagamento:* "+$("pag").value);
    if($("pag").value==="Dinheiro"&&$("troco").value.trim())L.push("*Troco para:* R$ "+$("troco").value.trim());
    if($("obs").value.trim())L.push("*Obs.:* "+$("obs").value.trim());
    var url=(WHATSAPP?"https://wa.me/"+WHATSAPP+"?text=":"https://api.whatsapp.com/send?text=")+encodeURIComponent(L.join("\n"));
    var w=null;try{w=window.open(url,"_blank")}catch(x){}
    $("lkA").href=url;$("lk").hidden=!!w;
    $("receiptControls").hidden=false;montarComprovante();
  };

  function montarComprovante(){
    var nome=$("nome").value.trim()||"Cliente";
    var entrega=$("tipo").value==="entrega";
    var data=new Date();
    var dataFmt=data.toLocaleDateString("pt-BR")+" "+data.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    var itens=Object.keys(cart).map(function(id){
      var i=todos[id];
      return "<div class='receipt-line'><span>"+cart[id]+"x "+esc(i.nome)+"</span><strong>"+brl(cart[id]*i.preco)+"</strong></div>";
    }).join("");
    var taxa=entrega?TAXA_ENTREGA:0;
    var end=entrega?("<div class='receipt-meta'><strong>Endereço:</strong> "+esc($("end").value.trim())+"</div>"):"";
    var troco=($("pag").value==="Dinheiro"&&$("troco").value.trim())?("<div class='receipt-meta'><strong>Troco para:</strong> R$ "+esc($("troco").value.trim())+"</div>"):"";
    var obs=$("obs").value.trim()?("<div class='receipt-meta'><strong>Observações:</strong> "+esc($("obs").value.trim())+"</div>"):"";
    var conteudo="<div class='receipt'><div class='receipt-head'><div class='receipt-brand'>🍔 TIBAS LANCHE</div><div class='receipt-sub'>COMPROVANTE DE PEDIDO</div></div>"+
      "<div class='receipt-meta'><strong>Data:</strong> "+dataFmt+"</div><div class='receipt-meta'><strong>Cliente:</strong> "+esc(nome)+"</div>"+
      "<div class='receipt-meta'><strong>Recebimento:</strong> "+(entrega?"Entrega":"Retirada no balcão")+"</div>"+end+
      "<div class='receipt-rule'></div><div class='receipt-title'>Itens do pedido</div>"+itens+"<div class='receipt-rule'></div>"+
      (taxa>0?"<div class='receipt-line'><span>Taxa de entrega</span><strong>"+brl(taxa)+"</strong></div>":"")+
      "<div class='receipt-total'><span>TOTAL</span><span>"+brl(total()+taxa)+"</span></div>"+
      "<div class='receipt-meta' style='margin-top:10px'><strong>Pagamento:</strong> "+esc($("pag").value)+"</div>"+troco+obs+
      "<div class='receipt-footer'>Obrigado pela preferência!<br>Tibas Lanche · Bom apetite 😋<br>Pedido enviado pelo WhatsApp</div></div>";
    $("receiptPreview").innerHTML=conteudo;
    $("printArea").innerHTML=conteudo;
  }
  $("imprimirComprovante").onclick=function(){montarComprovante();document.body.classList.add("receipt-printing");window.print();setTimeout(function(){document.body.classList.remove("receipt-printing")},500)};
  $("atualizarComprovante").onclick=montarComprovante;
  window.addEventListener("afterprint",function(){document.body.classList.remove("receipt-printing")});

  // ===== Comprovante em imagem (PNG) para compartilhar =====
  function wrapTxt(ctx,t,mw){var w=String(t).split(/\s+/),ls=[],c="";w.forEach(function(p){var tt=c?c+" "+p:p;if(ctx.measureText(tt).width>mw&&c){ls.push(c);c=p}else c=tt});if(c)ls.push(c);return ls}
  function gerarImagem(){
    var W=600,pad=34,entrega=$("tipo").value==="entrega",taxa=entrega?TAXA_ENTREGA:0;
    var nome=$("nome").value.trim()||"Cliente",d=new Date();
    var dataFmt=d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    function draw(ctx){
      var y=pad;ctx.textBaseline="top";
      function par(t,font,color,align,gap){ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;wrapTxt(ctx,t,W-2*pad).forEach(function(s){ctx.fillText(s,align==="center"?W/2:pad,y);y+=gap||30})}
      function rule(){y+=4;ctx.setLineDash([7,6]);ctx.strokeStyle="#777";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();ctx.setLineDash([]);y+=18}
      function row(l,r,bold,size){ctx.font=(bold?"bold ":"")+size+"px Arial";ctx.fillStyle="#171717";
        wrapTxt(ctx,l,W-2*pad-160).forEach(function(s,k){ctx.textAlign="left";ctx.fillText(s,pad,y);if(k===0){ctx.textAlign="right";ctx.fillText(r,W-pad,y);ctx.textAlign="left"}y+=size+8})}
      par("🍔 TIBAS LANCHE","bold 38px Arial","#171717","center",48);
      par("COMPROVANTE DE PEDIDO","20px Arial","#555","center",30);rule();
      par("Data: "+dataFmt,"22px Arial","#171717","left");
      par("Cliente: "+nome,"22px Arial","#171717","left");
      par("Recebimento: "+(entrega?"Entrega":"Retirada no balcão"),"22px Arial","#171717","left");
      if(entrega)par("Endereço: "+$("end").value.trim(),"22px Arial","#171717","left");
      rule();par("ITENS DO PEDIDO","bold 22px Arial","#171717","center",34);
      Object.keys(cart).forEach(function(id){var i=todos[id];row(cart[id]+"x "+i.nome,brl(cart[id]*i.preco),false,22)});
      rule();
      if(taxa>0)row("Taxa de entrega",brl(taxa),false,22);
      row("TOTAL",brl(total()+taxa),true,30);y+=8;
      par("Pagamento: "+$("pag").value,"22px Arial","#171717","left");
      if($("pag").value==="Dinheiro"&&$("troco").value.trim())par("Troco para: R$ "+$("troco").value.trim(),"22px Arial","#171717","left");
      if($("obs").value.trim())par("Observações: "+$("obs").value.trim(),"22px Arial","#171717","left");
      y+=6;rule();
      par("Obrigado pela preferência!","18px Arial","#444","center",26);
      par("Tibas Lanche · Bom apetite 😋","18px Arial","#444","center",26);
      par("Pedido enviado pelo WhatsApp","18px Arial","#444","center",26);
      return y+pad-10;
    }
    var H=Math.ceil(draw(document.createElement("canvas").getContext("2d")));
    var c=document.createElement("canvas");c.width=W*2;c.height=H*2;
    var ctx=c.getContext("2d");ctx.scale(2,2);ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);draw(ctx);
    return c;
  }
  $("compartilharComprovante").onclick=async function(){
    montarComprovante();
    var c=gerarImagem();
    var blob=await new Promise(function(r){c.toBlob(r,"image/png")});
    var url=URL.createObjectURL(blob);
    $("imgComp").src=url;$("baixarComp").href=url;$("imgBox").hidden=false;
    var file=new File([blob],"comprovante-tibas-lanche.png",{type:"image/png"});
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:"Comprovante – Tibas Lanche"});
        $("dica").textContent="Comprovante compartilhado ✔";return;
      }
    }catch(e){if(e&&e.name==="AbortError")return}
    $("dica").textContent="Seu aparelho não abriu o compartilhamento. Toque em “Salvar imagem” (ou segure a imagem) e envie pelo WhatsApp.";
  };

  function ir(cat){busca="";$("q").value="";catAtual=cat;renderTabs();renderMenu();$("dm").classList.remove("on");window.scrollTo({top:0,behavior:"smooth"})}
  document.querySelectorAll("[data-go]").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();ir(a.dataset.go)})});
  $("home").onclick=function(e){e.preventDefault();ir(MENU[0].cat)};
  $("dd").onclick=function(e){e.stopPropagation();$("dm").classList.toggle("on")};
  document.addEventListener("click",function(){$("dm").classList.remove("on")});
  $("q").oninput=function(){busca=this.value.toLowerCase().trim();renderMenu()};
  $("pedir").onclick=function(){if(qtd()){$("abrir").click()}else{$("menu").scrollIntoView({behavior:"smooth"})}};
  var root=document.documentElement;
  var savedTheme=null;try{savedTheme=localStorage.getItem("tibas-theme")}catch(e){}
  root.setAttribute("data-theme",savedTheme||"dark");
  $("tema").onclick=function(){var next=root.getAttribute("data-theme")==="dark"?"light":"dark";root.setAttribute("data-theme",next);try{localStorage.setItem("tibas-theme",next)}catch(e){}$("tema").textContent=next==="dark"?"☼ Tema escuro":"☀ Tema claro"};
  $("tema").textContent=root.getAttribute("data-theme")==="dark"?"☼ Tema escuro":"☀ Tema claro";
  renderTabs();refresh();
})();
